name: Deploy MEGAPARC Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No static_site_generator injection: next.config.ts already sets output, basePath, trailingSlash
      # and unoptimized images for GITHUB_PAGES=true. The injected config dropped trailingSlash and
      # exported approach.html instead of approach/index.html, breaking every trailing-slash link.
      - uses: actions/configure-pages@v5
      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/site-megaparc"
          NEXT_PUBLIC_SITE_URL: "https://ghennadiiacovlev-blip.github.io/site-megaparc"
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
